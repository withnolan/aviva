<style>
  :root { --studio: #ECEBE7; --graphite: #2A2926; }
  html, body { margin: 0; height: 100%; background: var(--studio); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #hud:empty { display: none; }
  #help { position: fixed; right: 12px; top: 10px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--graphite); opacity: .55; white-space: pre; text-align: right; pointer-events: none; }
